      /* Apply saved theme before paint to avoid flash of wrong theme */
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'dark';

        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
